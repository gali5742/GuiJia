name: BaZi context compaction

on:
  push:
    branches: [bazi-context-compact]
    paths:
      - '.github/workflows/bazi-context-compact.yml'
      - '.bazi-context-compact.py'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bazi-context-compact
      - name: Apply BaZi context compaction
        run: python3 .bazi-context-compact.py
      - name: Run full regression
        run: npm test
      - name: Commit verified BaZi-only changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .bazi-context-compact.py .github/workflows/bazi-context-compact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: compact BaZi analysis contexts'
          git push origin HEAD:bazi-context-compact
