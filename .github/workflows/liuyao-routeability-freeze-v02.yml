name: LiuYao Routeability Freeze v0.2

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'scripts/generate-liuyao-semantic-routeability-v02-model.mjs'
      - 'scripts/verify-liuyao-semantic-routeability-v02-model.mjs'
      - 'js/liuyao-semantic-routeability-v02.js'
      - 'js/liuyao-semantic-routeability-frozen-v02.js'
      - 'data/liuyao-semantic-routeability-v0.2-development.json'
      - '.github/workflows/liuyao-routeability-freeze-v02.yml'

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify fresh Routeability development data
        run: node scripts/verify-liuyao-semantic-routeability-v02-data.mjs
      - name: Install pinned Transformers.js
        run: npm install --no-save --package-lock=false @huggingface/transformers@4.2.0
      - name: Train and freeze Routeability v0.2
        run: node scripts/generate-liuyao-semantic-routeability-v02-model.mjs
      - name: Verify frozen Routeability artifact
        run: node scripts/verify-liuyao-semantic-routeability-v02-model.mjs
      - name: Commit frozen Routeability artifact
        run: |
          if [ -z "$(git status --porcelain -- data/liuyao-semantic-routeability-v0.2.json data/liuyao-semantic-routeability-v0.2.lock.json)" ]; then
            echo 'Frozen Routeability artifact already matches generated state.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-routeability-v0.2.json data/liuyao-semantic-routeability-v0.2.lock.json
          git commit -m 'chore(liuyao): freeze routeability v0.2 model'
          git push origin HEAD:liuyao-semantic-v013-core
