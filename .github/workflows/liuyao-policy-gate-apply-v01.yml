name: LiuYao Policy Gate Apply v0.1

on:
  push:
    branches:
      - liuyao-policy-freeze-v013-prep
    paths:
      - 'scripts/apply-liuyao-policy-gate-v01.mjs'
      - '.github/workflows/liuyao-policy-gate-apply-v01.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: liuyao-policy-freeze-v013-prep
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source/test patch
        run: node scripts/apply-liuyao-policy-gate-v01.mjs
      - name: Verify policy integration
        run: |
          node tests/liuyao-divination-policy-gate-v01-tests.js
          node scripts/verify-liuyao-divination-policy-gate-v01.mjs
          node tests/run-tests.js
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No integration diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/liuyao-core.js index.html tests/run-tests.js
          git commit -m 'test(liuyao): load policy gate in offline app harness'
          git push origin HEAD:liuyao-policy-freeze-v013-prep
