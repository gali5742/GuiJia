name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Production runtime boundary smoke test
        run: node tests/bazi-production-runtime-boundary-tests.js

      - name: Verify source production runtime boundary
        run: node scripts/verify-production-runtime-boundary.mjs .

      - name: Audit BaZi test/runtime coupling
        run: node scripts/audit-bazi-test-runtime-coupling.mjs

      - name: Verify BaZi research loader boundary
        run: node scripts/verify-bazi-research-loader-boundary.mjs

      - name: Hidden Single Target Binding regression
        run: node tests/bazi-contextual-force-party-hidden-single-target-binding-tests.js

      - name: Actor Group Identity regression
        run: node tests/bazi-contextual-force-party-actor-group-identity-tests.js

      - name: Source Actor Group Identity regression
        run: node tests/bazi-contextual-force-party-source-actor-group-identity-tests.js

      - name: Collective Mediation Effect regression
        run: node tests/bazi-contextual-force-party-collective-mediation-effect-tests.js

      - name: Source-Set Mediation E2E Calibration regression
        run: node tests/bazi-contextual-force-party-source-set-mediation-e2e-calibration-tests.js

      - name: Curated Finite Target Resolver regression
        run: node tests/bazi-contextual-force-party-curated-target-resolver-tests.js

      - name: Collective Relation Effect regression
        run: node tests/bazi-contextual-force-party-collective-relation-effect-tests.js

      - name: Actor-Set Opposition E2E Calibration regression
        run: node tests/bazi-contextual-force-party-actor-set-opposition-e2e-calibration-tests.js

      - name: Relation Endpoint Identity regression
        run: node tests/bazi-contextual-force-party-relation-endpoint-identity-tests.js

      - name: Counterfactual Placement Alternative regression
        run: node tests/bazi-contextual-force-party-counterfactual-placement-alternative-tests.js

      - name: Source-Scoped Sequential Composition regression
        run: node tests/bazi-contextual-force-party-source-scoped-sequential-composition-tests.js

      - name: Counterfactual Path Pair regression
        run: node tests/bazi-contextual-force-party-counterfactual-path-pair-tests.js

      - name: Regression tests
        run: npm test

      - name: Build Pages artifact with local vendor snapshots
        run: node scripts/build-pages-site.mjs

      - name: Verify built static cache key
        run: node scripts/verify-build-cache-key.mjs .site

      - name: Verify built production runtime boundary
        run: node scripts/verify-production-runtime-boundary.mjs .site

      - name: Verify deployed vendor snapshots
        run: node scripts/verify-vendor.mjs .site

      - name: Verify static Pages artifact
        run: node scripts/verify-static-site.mjs .site deployed

      - name: Install Chromium browser smoke runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Browser smoke built Pages artifact
        run: node scripts/browser-smoke.mjs .site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
