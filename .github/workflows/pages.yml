name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    name: shared-verification
    uses: ./.github/workflows/verify.yml
    with:
      upload_site_artifact: true
    permissions:
      contents: read

  package:
    name: package-verified-pages-artifact
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: verified-pages-site
          path: .site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: package
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
