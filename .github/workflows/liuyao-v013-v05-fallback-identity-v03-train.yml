name: LiuYao v0.13-v0.5 Fallback Identity v0.3 Train and Lock

on:
  push:
    branches: [liuyao-semantic-v013-core]
    paths:
      - 'data/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-execution-contract-v0.1.json'
      - 'scripts/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-execution-lib.mjs'
      - 'scripts/audit-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-reachability.mjs'
      - 'scripts/train-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-weights.mjs'
      - 'scripts/calibrate-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-threshold.mjs'
      - 'scripts/verify-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.mjs'
      - 'tests/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-calibration-tests.mjs'
      - '.github/workflows/liuyao-v013-v05-fallback-identity-v03-train.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: liuyao-v013-v05-fallback-identity-v03-training
  cancel-in-progress: false

jobs:
  train-and-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Capture immutable training base
        run: |
          echo "FI_TRAIN_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "GUIJIA_TRANSFORMERS_PACKAGE_DIR=$RUNNER_TEMP/fallback-identity-v03-runtime/node_modules/@huggingface/transformers" >> "$GITHUB_ENV"
          echo "GUIJIA_ENCODER_CACHE_DIR=$RUNNER_TEMP/fallback-identity-v03-encoder-cache" >> "$GITHUB_ENV"
      - name: Confirm committed seal and successful data CI before first Phase B encoder scoring
        run: node scripts/verify-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.mjs --preflight
      - name: Test predeclared calibration selection without encoder scoring
        run: node tests/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-calibration-tests.mjs
      - name: Install pinned CPU encoder runtime outside checkout
        run: npm install --prefix "$RUNNER_TEMP/fallback-identity-v03-runtime" --no-save --package-lock=false --no-audit --no-fund @huggingface/transformers@4.2.0
      - name: Audit upstream reachability without Fallback probabilities
        run: node scripts/audit-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-reachability.mjs
      - name: Commit upstream membership and vectors before training
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-reachability-audit-v0.1.json data/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-reachability.lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(liuyao): freeze v0.5 fallback v0.3 upstream reachability'
            git fetch origin liuyao-semantic-v013-core
            if ! git diff --quiet "$FI_TRAIN_BASE_SHA"..origin/liuyao-semantic-v013-core -- \
              'data/liuyao-semantic-*' 'js/liuyao-semantic-*' \
              'scripts/*liuyao-semantic-v013-candidate-v05*' \
              'tests/*liuyao-semantic-v013-candidate-v05*' '.github/workflows/liuyao-v013-v05-*'; then
              echo 'Frozen semantic inputs changed during upstream audit; refusing stale push.'
              exit 1
            fi
            git rebase origin/liuyao-semantic-v013-core
            node scripts/verify-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.mjs --reachability
            git push origin HEAD:liuyao-semantic-v013-core
          fi
          git diff --exit-code
          echo "FI_TRAIN_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Train weights on sealed training membership only
        run: node scripts/train-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-weights.mjs
      - name: Verify all22 weights before Fallback calibration scoring
        run: node scripts/verify-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.mjs --weights
      - name: Commit and push weights before calibration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.json \
            data/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(liuyao): lock v0.5 fallback identity v0.3 weights'
            git fetch origin liuyao-semantic-v013-core
            if ! git diff --quiet "$FI_TRAIN_BASE_SHA"..origin/liuyao-semantic-v013-core -- \
              'data/liuyao-semantic-*' 'js/liuyao-semantic-*' \
              'scripts/*liuyao-semantic-v013-candidate-v05*' \
              'tests/*liuyao-semantic-v013-candidate-v05*' '.github/workflows/liuyao-v013-v05-*'; then
              echo 'Frozen semantic inputs changed during training; refusing stale weights push.'
              exit 1
            fi
            git rebase origin/liuyao-semantic-v013-core
            node scripts/verify-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.mjs --weights
            git push origin HEAD:liuyao-semantic-v013-core
          fi
          git diff --exit-code
          echo "FI_CALIB_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Calibrate one global threshold on all raw sealed rows using committed upstream vectors
        id: calibrate
        continue-on-error: true
        run: node scripts/calibrate-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-threshold.mjs
      - name: Replay and verify calibration result without encoder rerun
        if: always() && steps.calibrate.outcome != 'skipped'
        run: node scripts/verify-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.mjs
      - name: Preserve immutable calibration success or failure
        if: always() && steps.calibrate.outcome != 'skipped'
        run: |
          set -euo pipefail
          REPORT=data/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-calibration-report.json
          LOCK=data/liuyao-semantic-v013-candidate-v05-fallback-identity-v03-threshold.lock.json
          test -f "$REPORT"
          node scripts/verify-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.mjs
          git add "$REPORT"
          if [ -f "$LOCK" ]; then git add "$LOCK"; fi
          if ! git diff --cached --quiet; then
            if [ "${{ steps.calibrate.outcome }}" = 'success' ]; then
              git commit -m 'chore(liuyao): lock v0.5 fallback identity v0.3 global threshold'
            else
              git commit -m 'test(liuyao): preserve v0.5 fallback identity v0.3 calibration failure'
            fi
            git fetch origin liuyao-semantic-v013-core
            if ! git diff --quiet "$FI_CALIB_BASE_SHA"..origin/liuyao-semantic-v013-core -- \
              'data/liuyao-semantic-*' 'js/liuyao-semantic-*' \
              'scripts/*liuyao-semantic-v013-candidate-v05*' \
              'tests/*liuyao-semantic-v013-candidate-v05*' '.github/workflows/liuyao-v013-v05-*'; then
              echo 'Frozen semantic inputs changed during calibration; refusing stale result push.'
              exit 1
            fi
            git rebase origin/liuyao-semantic-v013-core
            node scripts/verify-liuyao-semantic-v013-candidate-v05-fallback-identity-v03-model.mjs
            git push origin HEAD:liuyao-semantic-v013-core
          fi
          git diff --exit-code
          git show -s --format='%H %s'
      - name: Reject component lock if frozen calibration gates failed
        if: steps.calibrate.outcome != 'success'
        run: |
          echo 'Calibration failed or did not execute. No Phase C integrated runtime or fresh Candidate development may begin.'
          exit 1
