name: LiuYao v0.13 Failed Candidate Diagnostic

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'scripts/diagnose-liuyao-semantic-v013-independent-report.mjs'
      - '.github/workflows/liuyao-v013-failed-candidate-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify immutable candidate and independent report first
        run: |
          node scripts/verify-liuyao-semantic-v013-candidate-lock.mjs
          node scripts/verify-liuyao-semantic-v013-independent-eval.mjs
          node scripts/verify-liuyao-semantic-v013-independent-report.mjs
      - name: Diagnose failure distribution without changing candidate
        run: node scripts/diagnose-liuyao-semantic-v013-independent-report.mjs
      - name: Commit post-failure diagnostic
        run: |
          if [ -z "$(git status --porcelain -- data/liuyao-semantic-v013-candidate-v01-independent-diagnostic.json)" ]; then
            echo 'Diagnostic already matches immutable report.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-v013-candidate-v01-independent-diagnostic.json
          git commit -m 'test(liuyao): record v0.13 candidate v0.1 failure diagnostic'
          git push origin HEAD:liuyao-semantic-v013-core
