name: LiuYao v0.13-v0.4 Fallback Identity v0.2 Calibration v0.4 Reachability Audit

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'data/liuyao-semantic-v013-candidate-v04-fallback-identity-v02-calibration-v04-reachability-audit-contract-v0.1.json'
      - 'scripts/audit-liuyao-semantic-v013-candidate-v04-fallback-identity-v02-calibration-v04-reachability.mjs'
      - '.github/workflows/liuyao-v013-v04-fallback-identity-v02-calibration-v04-reachability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-calibration-v04-reachability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Capture immutable reachability audit checkout
        run: echo "CAL_V04_REACHABILITY_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify sealed calibration and frozen audit contract before encoder use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5ceead503f90683da3cd5acb9da6e14c3a299c04 HEAD
          git merge-base --is-ancestor b989be400833fac191589e55ca0f305bad40dc59 HEAD
          node - <<'NODE'
          const fs=require('fs');const crypto=require('crypto');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const c=require('./data/liuyao-semantic-v013-candidate-v04-fallback-identity-v02-calibration-v04-reachability-audit-contract-v0.1.json');
          const l=require('./data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.4.lock.json');
          const d=require('./data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.4.json');
          if(c.status!=='locked_before_first_postseal_calibration_v04_encoder_audit')process.exit(1);
          if(c.sealedCalibration.sealCommitSha!=='5ceead503f90683da3cd5acb9da6e14c3a299c04')process.exit(1);
          if(l.status!=='locked'||l.encoderScoringBeforeSeal!==false||l.fallbackIdentityTrainingPerformed!==false||l.fallbackThresholdSelected!==false||l.fallbackIdentityProbabilityUsed!==false)process.exit(1);
          if(d.status!=='sealed_fallback_stage_calibration'||d.sealed!==true||d.policy?.encoderScoringObserved!==false)process.exit(1);
          if(sha(l.calibrationPath)!==c.sealedCalibration.sha256||sha(l.schemaPath)!==c.sealedCalibration.schemaSha256)process.exit(1);
          if(l.calibrationRows!==704||l.routeKnownRows!==220||l.nearDomainRows!==440||l.outsideCurrent22Rows!==22||l.routeUnresolvedRows!==22)process.exit(1);
          if(c.encoder.canonicalTextsPerEncoderCall!==1||c.encoder.expectedEncoderCalls!==704||c.encoder.transformersJsVersion!=='4.2.0')process.exit(1);
          if(c.frozenChecks.minimumCalibrationKnownSemanticActRetention!==0.95)process.exit(1);
          if(c.frozenChecks.minimumCalibrationNearDomainNonRouteReachingFallback!==8||c.frozenChecks.minimumCalibrationTotalNonRouteReachingFallback!==8)process.exit(1);
          if(c.frozenChecks.requireEveryRouteHasAtLeastOneCalibrationKnownReachingFallback!==true)process.exit(1);
          if(c.auditOnly.fallbackIdentityWeightsTrained!==false||c.auditOnly.fallbackIdentityProbabilitiesScored!==false||c.auditOnly.fallbackThresholdSelected!==false)process.exit(1);
          if(c.auditOnly.routerLoaded!==false||c.auditOnly.routerTopKRead!==false||c.auditOnly.v03ReachabilityRowResultsRead!==false||c.auditOnly.independentEvaluationRead!==false||c.auditOnly.sealedBlindEvaluationRead!==false)process.exit(1);
          NODE
      - name: Install pinned Transformers.js only after contract freeze
        run: npm install --no-save --package-lock=false @huggingface/transformers@4.2.0
      - name: Run sealed calibration v0.4 upstream reachability audit
        id: audit
        continue-on-error: true
        run: node scripts/audit-liuyao-semantic-v013-candidate-v04-fallback-identity-v02-calibration-v04-reachability.mjs
      - name: Verify and commit immutable reachability result
        if: always() && steps.audit.outcome != 'skipped'
        run: |
          set -euo pipefail
          FILE='data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.4-reachability-audit-v0.1.json'
          test -f "$FILE"
          node - <<'NODE'
          const d=require('./data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.4-reachability-audit-v0.1.json');
          if(d.policy?.auditOnly!==true)process.exit(1);
          if(d.policy?.fallbackIdentityWeightsTrained!==false||d.policy?.fallbackIdentityProbabilitiesScored!==false||d.policy?.fallbackThresholdSelected!==false)process.exit(1);
          if(d.policy?.routerLoaded!==false||d.policy?.routerTopKRead!==false||d.policy?.v03ReachabilityRowResultsRead!==false)process.exit(1);
          if(d.policy?.independentEvaluationRead!==false||d.policy?.sealedBlindEvaluationRead!==false||d.policy?.candidateV03FailureRowsRead!==false)process.exit(1);
          if(d.execution?.canonicalTextsPerEncoderCall!==1||d.execution?.encoderCalls!==704||d.execution?.rowsScored!==704)process.exit(1);
          if(d.frozenChecks?.minimumCalibrationKnownSemanticActRetention!==0.95)process.exit(1);
          if(d.frozenChecks?.minimumCalibrationNearDomainNonRouteReachingFallback!==8||d.frozenChecks?.minimumCalibrationTotalNonRouteReachingFallback!==8)process.exit(1);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then
            echo 'Calibration v0.4 reachability report already matches committed state.'
          else
            if [ '${{ steps.audit.outcome }}' = 'success' ]; then
              git commit -m 'test(liuyao): record fallback calibration v0.4 reachability pass'
            else
              git commit -m 'test(liuyao): record fallback calibration v0.4 reachability failure'
            fi
          fi
          git fetch origin liuyao-semantic-v013-core
          PROTECTED_PATHS=(
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.4.json
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.4.lock.json
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-v02-data-schema-v0.4.1.json
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-training-augmentation.json
            data/liuyao-semantic-v013-candidate-v04-semantic-act-v01-model.json
            data/liuyao-semantic-v013-candidate-v04-semantic-act-v01-model.lock.json
            data/liuyao-semantic-routeability-v0.2-execution-v0.1.json
            data/liuyao-semantic-routeability-v0.3-execution-v0.1.json
            data/liuyao-semantic-embedding-execution-contract-v0.1.json
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-v02-calibration-v04-reachability-audit-contract-v0.1.json
            scripts/audit-liuyao-semantic-v013-candidate-v04-fallback-identity-v02-calibration-v04-reachability.mjs
          )
          if ! git diff --quiet "$CAL_V04_REACHABILITY_BASE_SHA"..origin/liuyao-semantic-v013-core -- "${PROTECTED_PATHS[@]}"; then
            echo 'Calibration v0.4 reachability inputs changed during scoring; refusing stale report push.'
            git diff --name-only "$CAL_V04_REACHABILITY_BASE_SHA"..origin/liuyao-semantic-v013-core -- "${PROTECTED_PATHS[@]}"
            exit 1
          fi
          git rebase origin/liuyao-semantic-v013-core
          git push origin HEAD:liuyao-semantic-v013-core
      - name: Fail workflow if frozen reachability checks failed
        if: steps.audit.outcome != 'success'
        run: |
          echo 'Sealed Fallback calibration v0.4 failed frozen upstream reachability checks; do not train Fallback Identity v0.2.'
          exit 1
