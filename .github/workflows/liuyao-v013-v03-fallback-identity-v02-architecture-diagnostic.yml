name: LiuYao v0.13-v0.3 Fallback Identity v0.2 Architecture Diagnostic

on:
  push:
    branches:
      - liuyao-semantic-v013-core-train-v01
    paths:
      - 'scripts/diagnose-liuyao-semantic-v013-fallback-identity-v02-architecture.mjs'
      - '.github/workflows/liuyao-v013-v03-fallback-identity-v02-architecture-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core-train-v01
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify canonical embedding execution contract
        run: node scripts/verify-liuyao-semantic-embedding-execution-contract-v01.mjs
      - name: Verify corrected semantic dependencies
        run: node scripts/verify-liuyao-semantic-frozen-dependencies-v02.mjs
      - name: Verify corrected Routeability
        run: node scripts/verify-liuyao-semantic-routeability-v04-model.mjs
      - name: Verify corrected Fallback Identity
        run: node scripts/verify-liuyao-semantic-v013-fallback-identity-v02-model.mjs
      - name: Install pinned encoder runtime
        run: npm install --no-save --package-lock=false @huggingface/transformers@4.2.0
      - name: Diagnose corrected Fallback Identity architecture
        run: node scripts/diagnose-liuyao-semantic-v013-fallback-identity-v02-architecture.mjs
      - name: Commit architecture diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-fallback-identity-v0.2-architecture-diagnostic.json
          git commit -m 'test(liuyao): record corrected fallback identity architecture diagnosis'
          git push origin HEAD:liuyao-semantic-v013-core-train-v01
