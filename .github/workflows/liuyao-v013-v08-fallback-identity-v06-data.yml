name: Candidate v0.8 fresh raw data seal

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liuyao-v013-v08-data
  cancel-in-progress: false

jobs:
  frozen-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prove isolated entry and committed literal source
        run: |
          set -euo pipefail
          NODE_OPTIONS='--require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs' node scripts/verify-liuyao-semantic-v013-candidate-v08-ci-source.mjs
          echo "V08_DATA_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.V08_DATA_SHA }}
          fetch-depth: 0
      - name: Test Arbitration responsibility and data integrity
        run: NODE_OPTIONS='--require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs' node --test tests/liuyao-semantic-route-arbitration-v013-tests.mjs tests/liuyao-semantic-v013-candidate-v08-data-tests.mjs tests/liuyao-semantic-v013-candidate-v07-fallback-identity-v05-policy-tests.mjs
      - name: Seal all raw calibration and historical train-only members without encoder
        run: NODE_OPTIONS='--require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs' node scripts/liuyao-semantic-v013-candidate-v08-fallback-identity-v06-data.mjs --seal
      - name: Replay deterministic complete seal and immutable reseal
        run: |
          set -euo pipefail
          export NODE_OPTIONS='--require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs'
          node scripts/liuyao-semantic-v013-candidate-v08-fallback-identity-v06-data.mjs --uncommitted-outputs
          node scripts/liuyao-semantic-v013-candidate-v08-fallback-identity-v06-data.mjs --seal
      - name: Commit complete data seal without overwriting semantic work
        run: |
          set -euo pipefail
          export NODE_OPTIONS='--require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-v013-candidate-v08-fallback-identity-v06-training.json data/liuyao-semantic-v013-candidate-v08-fallback-identity-v06-calibration.json data/liuyao-semantic-v013-candidate-v08-fallback-identity-v06-contamination-audit-v0.1.json data/liuyao-semantic-v013-candidate-v08-fallback-identity-v06-data.lock.json
          git commit -m 'test(liuyao): seal v0.8 complete fresh raw calibration and train-only source [skip ci]'
          git fetch origin liuyao-semantic-v013-core
          if ! git diff --quiet "$V08_DATA_SHA"..origin/liuyao-semantic-v013-core -- 'data/liuyao-semantic-*' 'js/liuyao-semantic-*' 'scripts/*liuyao-semantic*' 'tests/*liuyao-semantic*' '.github/workflows/liuyao-v013-*'; then
            echo 'Semantic inputs changed; refusing stale seal push.'
            exit 1
          fi
          git rebase origin/liuyao-semantic-v013-core
          node scripts/liuyao-semantic-v013-candidate-v08-fallback-identity-v06-data.mjs
          git push origin HEAD:liuyao-semantic-v013-core
      - name: Confirm committed seal
        run: |
          set -euo pipefail
          git diff --exit-code
          NODE_OPTIONS='--require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs' node scripts/liuyao-semantic-v013-candidate-v08-fallback-identity-v06-data.mjs
