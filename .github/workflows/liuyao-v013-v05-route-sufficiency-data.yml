name: LiuYao v0.13-v0.5 Route Sufficiency Data Seal

on:
  push:
    branches: [liuyao-semantic-v013-core]
    paths:
      - 'data/liuyao-semantic-v013-candidate-v05-route-sufficiency-authoring-v0.1.json'
      - 'data/liuyao-semantic-v013-candidate-v05-route-sufficiency-data-contract-v0.1.json'
      - 'js/liuyao-semantic-route-sufficiency-model-v01.js'
      - 'scripts/*liuyao-semantic-v013-candidate-v05-route-sufficiency*data*.mjs'
      - 'tests/liuyao-semantic-v013-candidate-v05-route-sufficiency-data-tests.mjs'
      - '.github/workflows/liuyao-v013-v05-route-sufficiency-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liuyao-v013-v05-route-sufficiency-data-seal
  cancel-in-progress: false

jobs:
  seal-route-sufficiency-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Capture seal base
        run: echo "RS_DATA_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify frozen Candidate v0.5 design
        run: node scripts/verify-liuyao-semantic-v013-candidate-v05-design.mjs
      - name: Generate or check literal fresh corpora without encoder scoring
        run: node scripts/generate-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs
      - name: Verify preseal membership, labels, coverage and contamination
        run: node scripts/verify-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs
      - name: Verify governance failure checks
        run: node tests/liuyao-semantic-v013-candidate-v05-route-sufficiency-data-tests.mjs
      - name: Seal training and calibration together
        run: node scripts/seal-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs
      - name: Verify sealed membership and deterministic regeneration
        run: |
          node scripts/verify-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs --require-seal
          node scripts/generate-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs
          node scripts/seal-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs
          node scripts/verify-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs --require-seal
      - name: Commit seal without overwriting parallel work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-training.json \
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-calibration.json \
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-contamination-audit-v0.1.json \
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-data.lock.json
          if git diff --cached --quiet; then
            echo 'Existing committed seal already verified; no rewrite.'
            exit 0
          fi
          git commit -m 'test(liuyao): seal v0.5 route sufficiency fresh data'
          git fetch origin liuyao-semantic-v013-core
          PROTECTED_PATHS=(
            data/liuyao-semantic-v013-candidate-v05-design-v0.1.json
            data/liuyao-semantic-v013-candidate-v05-design.lock.json
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-boundary-review-v0.1.json
            data/liuyao-semantic-route-inventory-v0.2.json
            data/liuyao-semantic-embedding-execution-contract-v0.1.json
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-authoring-v0.1.json
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-data-contract-v0.1.json
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-training.json
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-calibration.json
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-data.lock.json
            data/liuyao-semantic-v013-candidate-v05-route-sufficiency-contamination-audit-v0.1.json
            js/liuyao-semantic-route-sufficiency-model-v01.js
            scripts/liuyao-semantic-v013-candidate-v05-route-sufficiency-data-lib.mjs
            scripts/generate-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs
            scripts/verify-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs
            scripts/seal-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs
            tests/liuyao-semantic-v013-candidate-v05-route-sufficiency-data-tests.mjs
            .github/workflows/liuyao-v013-v05-route-sufficiency-data.yml
          )
          if ! git diff --quiet "$RS_DATA_BASE_SHA"..origin/liuyao-semantic-v013-core -- "${PROTECTED_PATHS[@]}"; then
            echo 'Frozen sufficiency inputs or seal changed during CI; refusing stale push.'
            exit 1
          fi
          git rebase origin/liuyao-semantic-v013-core
          node scripts/verify-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs --require-seal
          git push origin HEAD:liuyao-semantic-v013-core
      - name: Confirm committed seal
        run: |
          set -euo pipefail
          git diff --exit-code
          git show -s --format='%H %s'
          node scripts/verify-liuyao-semantic-v013-candidate-v05-route-sufficiency-v01-data.mjs --require-seal
