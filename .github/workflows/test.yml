name: Test and vendor verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: shared-verification
    uses: ./.github/workflows/verify.yml
    with:
      upload_site_artifact: false
    permissions:
      contents: read

  test:
    name: test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Confirm shared verification ownership
        run: |
          grep -F "node scripts/verify-static-site.mjs .site deployed" .github/workflows/verify.yml
          grep -F "node scripts/browser-smoke.mjs .site" .github/workflows/verify.yml
          echo "Shared verification completed successfully; protected check 'test' may pass."
