name: Test and vendor verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: shared-verification
    uses: ./.github/workflows/verify.yml
    with:
      upload_site_artifact: false
    permissions:
      contents: read

  test:
    name: test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Confirm shared verification gate
        run: echo "Shared verification completed successfully."
