name: Test and vendor verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply Ding-fire source wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/bazi-literature.js')
          text = p.read_text(encoding='utf-8')
          old = '抱乙而考'
          new = '抱乙而孝'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one {old}, got {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q '抱乙而孝' js/bazi-literature.js
          ! grep -q '抱乙而考' js/bazi-literature.js

      - name: Core regression tests
        run: npm test

      - name: Build same-origin vendor site
        run: node scripts/build-pages-site.mjs

      - name: Verify vendor bytes and lunar smoke test
        run: node scripts/verify-vendor.mjs .site

      - name: Verify static Pages artifact
        run: node scripts/verify-static-site.mjs .site deployed

      - name: Commit verified BaZi source wording
        if: github.ref == 'refs/heads/bazi-ditiansui-xiao'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/bazi-literature.js
          git commit -m 'fix: adopt 孝 wording in 丁火 source'
          git push origin HEAD:bazi-ditiansui-xiao
