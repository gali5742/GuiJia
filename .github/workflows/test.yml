name: Test and vendor verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply BaZi context final cleanup
        run: |
          python3 .bazi-final3.py
          python3 .bazi-final3-regression.py

      - name: Core regression tests
        run: npm test

      - name: Build same-origin vendor site
        run: node scripts/build-pages-site.mjs

      - name: Verify vendor bytes and lunar smoke test
        run: node scripts/verify-vendor.mjs .site

      - name: Verify static Pages artifact
        run: node scripts/verify-static-site.mjs .site deployed

      - name: Commit verified BaZi cleanup
        if: github.ref == 'refs/heads/bazi-context-final3'
        shell: bash
        run: |
          set -euo pipefail
          git show f380f8e2d424b447f1b70c61f371a7376971afe4:.github/workflows/test.yml > .github/workflows/test.yml
          rm -f .bazi-final3.py .bazi-final3-regression.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/bazi-interpretation.js js/bazi-transit-analysis.js tests/bazi-semantic-layer-tests.js tests/run-tests.js .github/workflows/test.yml .bazi-final3.py .bazi-final3-regression.py
          git commit -m 'refactor: finalize BaZi context wording'
          git push origin HEAD:bazi-context-final3
