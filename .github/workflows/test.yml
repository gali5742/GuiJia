name: Test and vendor verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply BaZi structure references
        run: python3 .bazi-structure-ref.py

      - name: Core regression tests
        run: npm test

      - name: Build same-origin vendor site
        run: node scripts/build-pages-site.mjs

      - name: Verify vendor bytes and lunar smoke test
        run: node scripts/verify-vendor.mjs .site

      - name: Verify static Pages artifact
        run: node scripts/verify-static-site.mjs .site deployed

      - name: Commit verified BaZi structure references
        if: github.ref == 'refs/heads/bazi-structure-ref-stage'
        shell: bash
        run: |
          set -euo pipefail
          git show 023f9b5ca7638809dd5303058a76676d6840c785:.github/workflows/test.yml > .github/workflows/test.yml
          rm -f .bazi-structure-ref.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/bazi-transit-analysis.js tests/bazi-semantic-layer-tests.js .github/workflows/test.yml .bazi-structure-ref.py
          git commit -m 'feat: link BaZi transits to original structures'
          git push origin HEAD:bazi-structure-ref-stage
