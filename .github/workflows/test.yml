name: Test and vendor verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply BaZi structure reference refinement
        run: |
          python3 .bazi-structure-ref-v2.py
          python3 .bazi-structure-ref-v2-fix.py

      - name: Core regression tests
        run: npm test

      - name: Build same-origin vendor site
        run: node scripts/build-pages-site.mjs

      - name: Verify vendor bytes and lunar smoke test
        run: node scripts/verify-vendor.mjs .site

      - name: Verify static Pages artifact
        run: node scripts/verify-static-site.mjs .site deployed

      - name: Commit verified BaZi structure reference refinement
        if: github.ref == 'refs/heads/bazi-structure-ref-v2-stage' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git show 2e40a5a3b652b82002584907337edb8681bd6584:.github/workflows/test.yml > .github/workflows/test.yml
          rm -f .bazi-structure-ref-v2.py .bazi-structure-ref-v2-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/bazi-core.js js/bazi-interpretation.js js/bazi-transit-analysis.js tests/bazi-semantic-layer-tests.js tests/run-tests.js .github/workflows/test.yml .bazi-structure-ref-v2.py .bazi-structure-ref-v2-fix.py
          git commit -m 'refactor: distinguish BaZi structure member interactions'
          git push origin HEAD:bazi-structure-ref-v2-stage
