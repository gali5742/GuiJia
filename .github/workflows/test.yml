name: Test and vendor verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply BaZi assessment contract
        run: python3 .bazi-assessment-stage.py

      - name: Core regression tests
        run: npm test

      - name: Build same-origin vendor site
        run: node scripts/build-pages-site.mjs

      - name: Verify vendor bytes and lunar smoke test
        run: node scripts/verify-vendor.mjs .site

      - name: Verify static Pages artifact
        run: node scripts/verify-static-site.mjs .site deployed

      - name: Commit verified BaZi assessment contract
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/test.yml
          rm -f .bazi-assessment-stage.py
          git add js/bazi-assessment.js js/bazi-interpretation.js index.html tests/bazi-semantic-layer-tests.js tests/run-tests.js .github/workflows/test.yml
          git commit -m "refactor: establish BaZi Assessment contract"
          git push origin HEAD:bazi-assessment-contract-stage
