name: Calibrate semantic route acceptance
on:
  push:
    branches: [liuyao-semantic-v013-core]
    paths: ['experiments/liuyao-route-admission-v01/run.mjs', '.github/workflows/semantic-route-admission-v01.yml']
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify split allocation and contamination
        run: node --require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs experiments/liuyao-route-admission-v01/run.mjs audit
      - name: Install pinned encoder
        run: |
          npm install --prefix "$RUNNER_TEMP/runtime" --no-save --package-lock=false --no-audit --no-fund @huggingface/transformers@4.2.0
          echo "GUIJIA_TRANSFORMERS_PACKAGE_DIR=$RUNNER_TEMP/runtime/node_modules/@huggingface/transformers" >> "$GITHUB_ENV"
          echo "GUIJIA_ENCODER_CACHE_DIR=$RUNNER_TEMP/encoder" >> "$GITHUB_ENV"
      - name: Calibrate on single questions
        run: |
          node --require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs experiments/liuyao-route-admission-v01/run.mjs calibration
          echo "LOCK_DIGEST=$(sha256sum calibration-lock.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-route-admission-calibration
          path: calibration-lock.json
          if-no-files-found: error
      - name: Evaluate locked policy on fresh questions
        run: node --require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs experiments/liuyao-route-admission-v01/run.mjs confirmation
