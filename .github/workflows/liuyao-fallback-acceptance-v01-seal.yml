name: LiuYao Fallback Acceptance v0.1 Seal Calibration

on:
  push:
    branches:
      - liuyao-semantic-v013-core-train-v01
    paths:
      - 'scripts/seal-liuyao-semantic-fallback-acceptance-v01-calibration.mjs'
      - '.github/workflows/liuyao-fallback-acceptance-v01-seal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core-train-v01
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify frozen acceptance architecture contract
        run: node scripts/verify-liuyao-semantic-fallback-acceptance-v01-contract.mjs
      - name: Verify presealed fresh calibration
        run: node scripts/verify-liuyao-semantic-fallback-acceptance-v01-calibration.mjs
      - name: Seal and lock fresh calibration
        run: node scripts/seal-liuyao-semantic-fallback-acceptance-v01-calibration.mjs
      - name: Verify sealed fresh calibration
        run: node scripts/verify-liuyao-semantic-fallback-acceptance-v01-calibration.mjs
      - name: Commit sealed calibration and lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-fallback-acceptance-v0.1-calibration.json data/liuyao-semantic-fallback-acceptance-v0.1-calibration.lock.json
          git commit -m 'test(liuyao): seal fallback acceptance v0.1 calibration'
          git push origin HEAD:liuyao-semantic-v013-core-train-v01
