name: LiuYao Routeability v0.3 Calibration Data

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'scripts/generate-liuyao-semantic-routeability-v03-calibration.mjs'
      - 'scripts/apply-liuyao-semantic-routeability-v03-calibration-preseal-patch.mjs'
      - 'scripts/verify-liuyao-semantic-routeability-v03-calibration.mjs'
      - 'data/liuyao-semantic-routeability-v0.3-calibration-preseal-patch.json'
      - '.github/workflows/liuyao-routeability-v03-calibration-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate fresh calibration corpus
        run: node scripts/generate-liuyao-semantic-routeability-v03-calibration.mjs
      - name: Apply pre-seal wording correction
        run: node scripts/apply-liuyao-semantic-routeability-v03-calibration-preseal-patch.mjs
      - name: Verify path contracts and full prior-corpus isolation
        run: node scripts/verify-liuyao-semantic-routeability-v03-calibration.mjs
      - name: Commit verified calibration corpus
        run: |
          if [ -z "$(git status --porcelain -- data/liuyao-semantic-routeability-v0.3-calibration.json)" ]; then
            echo 'Calibration corpus already matches generator plus pre-seal patch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-routeability-v0.3-calibration.json
          git commit -m 'test(liuyao): seal fresh routeability v0.3 calibration corpus'
          git push origin HEAD:liuyao-semantic-v013-core
