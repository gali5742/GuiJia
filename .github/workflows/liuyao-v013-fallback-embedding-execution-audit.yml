name: LiuYao v0.13 Fallback Embedding Execution Audit

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'scripts/audit-liuyao-semantic-v013-fallback-identity-embedding-execution-v01.mjs'
      - '.github/workflows/liuyao-v013-fallback-embedding-execution-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify frozen Fallback Identity model
        run: node scripts/verify-liuyao-semantic-fallback-identity-v01-model.mjs
      - name: Install pinned Transformers.js
        run: npm install --no-save --package-lock=false @huggingface/transformers@4.2.0
      - name: Audit single-text vs batch24 embedding execution
        run: node scripts/audit-liuyao-semantic-v013-fallback-identity-embedding-execution-v01.mjs
      - name: Commit architecture-only audit report
        run: |
          if [ -z "$(git status --porcelain -- data/liuyao-semantic-fallback-identity-v0.1-embedding-execution-audit.json)" ]; then
            echo 'Embedding execution audit report already matches generated state.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-fallback-identity-v0.1-embedding-execution-audit.json
          git commit -m 'test(liuyao): record fallback embedding execution audit'
          git push origin HEAD:liuyao-semantic-v013-core
