name: LiuYao Candidate v0.7 Question Mode Contract

on:
  push:
    branches:
      - liuyao-semantic-v013-core-train-v01
    paths:
      - 'data/liuyao-semantic-v013-candidate-v06-terminal-v0.1.json'
      - 'data/liuyao-semantic-v013-candidate-v07-design-v0.1.json'
      - 'js/liuyao-semantic-question-mode-v01.js'
      - 'js/liuyao-semantic-route-arbitration-v015.js'
      - 'scripts/verify-liuyao-semantic-v013-candidate-v07-design.mjs'
      - 'scripts/verify-liuyao-semantic-v013-candidate-v07-semantics.mjs'
      - '.github/workflows/liuyao-v013-candidate-v07-contract.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core-train-v01
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify Candidate v0.7 design freeze
        run: node scripts/verify-liuyao-semantic-v013-candidate-v07-design.mjs
      - name: Verify Candidate v0.7 route-agnostic Question Mode semantics
        run: node scripts/verify-liuyao-semantic-v013-candidate-v07-semantics.mjs
