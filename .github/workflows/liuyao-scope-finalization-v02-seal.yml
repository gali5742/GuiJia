name: LiuYao Scope Finalization v0.2 Seal Calibration

on:
  push:
    branches:
      - liuyao-semantic-v013-core-train-v01
    paths:
      - 'scripts/seal-liuyao-semantic-scope-finalization-v02-calibration.mjs'
      - 'scripts/verify-liuyao-semantic-scope-finalization-v02-sealed.mjs'
      - '.github/workflows/liuyao-scope-finalization-v02-seal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core-train-v01
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify Candidate v0.4 assembly contract
        run: node scripts/verify-liuyao-semantic-v013-candidate-v04-design.mjs
      - name: Verify verified presealed Scope calibration
        run: node scripts/verify-liuyao-semantic-scope-finalization-v02-calibration.mjs
      - name: Seal and lock Scope calibration
        run: node scripts/seal-liuyao-semantic-scope-finalization-v02-calibration.mjs
      - name: Verify sealed Scope calibration lock
        run: node scripts/verify-liuyao-semantic-scope-finalization-v02-sealed.mjs
      - name: Commit sealed Scope calibration and lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-scope-finalization-v0.2-calibration.json data/liuyao-semantic-scope-finalization-v0.2-calibration.lock.json
          git commit -m 'test(liuyao): seal fresh scope finalization calibration'
          git push origin HEAD:liuyao-semantic-v013-core-train-v01
