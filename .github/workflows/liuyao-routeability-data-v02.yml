name: LiuYao Routeability Data v0.2

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'scripts/generate-liuyao-semantic-routeability-v02-data.mjs'
      - 'scripts/verify-liuyao-semantic-routeability-v02-data.mjs'
      - '.github/workflows/liuyao-routeability-data-v02.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate fresh Routeability data
        run: node scripts/generate-liuyao-semantic-routeability-v02-data.mjs
      - name: Verify counts, policy boundary and prior-corpus isolation
        run: node scripts/verify-liuyao-semantic-routeability-v02-data.mjs
      - name: Commit sealed development data
        run: |
          if [ -z "$(git status --porcelain -- data/liuyao-semantic-routeability-v0.2-development.json)" ]; then
            echo 'Generated Routeability data already matches committed state.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-routeability-v0.2-development.json
          git commit -m 'test(liuyao): seal routeability v0.2 development data'
          git push origin HEAD:liuyao-semantic-v013-core
