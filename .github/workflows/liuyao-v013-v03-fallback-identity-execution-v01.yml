name: LiuYao v0.13-v0.3 Fallback Identity Single-Text Correction

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'data/liuyao-semantic-fallback-identity-v0.1-execution-v0.1-correction-contract.json'
      - 'data/liuyao-semantic-fallback-identity-v0.1-execution-v0.1-calibration-runtime.lock.json'
      - 'scripts/verify-liuyao-semantic-fallback-identity-v01-execution-v01-preflight.mjs'
      - 'scripts/train-and-calibrate-liuyao-semantic-fallback-identity-v01-execution-v01.mjs'
      - 'scripts/verify-liuyao-semantic-fallback-identity-v01-execution-v01-model.mjs'
      - '.github/workflows/liuyao-v013-v03-fallback-identity-execution-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-freeze-corrected:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Capture corrected pre-scoring checkout
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify corrected pre-scoring freeze
        run: node scripts/verify-liuyao-semantic-fallback-identity-v01-execution-v01-preflight.mjs

      - name: Verify unchanged Fallback Identity algorithm contracts
        run: node tests/liuyao-semantic-fallback-identity-model-v01-tests.js

      - name: Verify unchanged Candidate v0.3 deterministic contracts
        run: node tests/liuyao-semantic-v013-candidate-v03-contract-tests.js

      - name: Verify semantic responsibility boundary before scoring
        run: node scripts/verify-liuyao-semantic-responsibility-audit.mjs

      - name: Install pinned Transformers.js
        run: npm install --no-save --package-lock=false @huggingface/transformers@4.2.0

      - name: Retrain 22 heads in canonical single-text representation and calibrate one global threshold
        id: train
        continue-on-error: true
        run: node scripts/train-and-calibrate-liuyao-semantic-fallback-identity-v01-execution-v01.mjs

      - name: Verify corrected frozen model when calibration is feasible
        if: steps.train.outcome == 'success'
        run: node scripts/verify-liuyao-semantic-fallback-identity-v01-execution-v01-model.mjs

      - name: Commit immutable corrected training result
        if: always() && steps.train.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          MODEL='data/liuyao-semantic-fallback-identity-v0.1-execution-v0.1-model.json'
          REPORT='data/liuyao-semantic-fallback-identity-v0.1-execution-v0.1-calibration-report.json'
          LOCK='data/liuyao-semantic-fallback-identity-v0.1-execution-v0.1-model.lock.json'

          if [ ! -f "$MODEL" ] || [ ! -f "$REPORT" ]; then
            echo 'Corrected training did not produce auditable result artifacts.'
            exit 1
          fi

          git add "$MODEL" "$REPORT"
          git add -A -- "$LOCK"

          if git diff --cached --quiet; then
            echo 'Corrected training result already matches committed state.'
          else
            if [ "${{ steps.train.outcome }}" = 'success' ]; then
              git commit -m 'chore(liuyao): freeze fallback identity v0.1 single-text correction'
            else
              git commit -m 'test(liuyao): record fallback identity single-text calibration failure'
            fi
          fi

          git fetch origin liuyao-semantic-v013-core
          if ! git diff --quiet "$BASE_SHA"..origin/liuyao-semantic-v013-core -- \
            data/liuyao-semantic-fallback-identity-v0.1-execution-v0.1-correction-contract.json \
            data/liuyao-semantic-fallback-identity-v0.1-execution-v0.1-calibration-runtime.lock.json \
            data/liuyao-semantic-fallback-identity-v0.1-training-contract.json \
            data/liuyao-semantic-fallback-identity-v0.1-data.lock.json \
            data/liuyao-semantic-fallback-identity-v0.1-training.json \
            data/liuyao-semantic-fallback-identity-v0.1-calibration.json \
            data/liuyao-semantic-embedding-execution-contract-v0.1.json \
            data/liuyao-semantic-frozen-dependencies-v0.2.json \
            data/liuyao-semantic-frozen-dependencies-v0.2.lock.json \
            data/liuyao-semantic-routeability-v0.2-execution-v0.1.json \
            data/liuyao-semantic-routeability-v0.2-execution-v0.1.lock.json \
            data/liuyao-semantic-routeability-v0.3-execution-v0.1.json \
            data/liuyao-semantic-routeability-v0.3-execution-v0.1.lock.json \
            js/liuyao-semantic-fallback-identity-model-v01.js \
            js/liuyao-semantic-route-evidence-v01.js \
            js/liuyao-semantic-route-evidence-v02.js \
            js/liuyao-semantic-route-evidence-v03.js \
            js/liuyao-semantic-route-arbitration-v011.js \
            js/liuyao-semantic-route-arbitration-v012.js \
            js/liuyao-semantic-route-compatibility-v01.js \
            js/liuyao-semantic-route-compatibility-v02.js \
            js/liuyao-semantic-route-compatibility-v03.js \
            js/liuyao-semantic-routeability-v05.js \
            js/liuyao-semantic-fallback-identity-v01.js \
            js/liuyao-semantic-route-selection-v04.js \
            js/liuyao-semantic-finalization-v01.js \
            scripts/train-and-calibrate-liuyao-semantic-fallback-identity-v01.mjs \
            scripts/verify-liuyao-semantic-fallback-identity-v01-execution-v01-preflight.mjs \
            scripts/train-and-calibrate-liuyao-semantic-fallback-identity-v01-execution-v01.mjs \
            scripts/verify-liuyao-semantic-fallback-identity-v01-execution-v01-model.mjs; then
            echo 'Corrected training/calibration inputs changed while this run was executing; refusing to publish stale result.'
            exit 1
          fi

          git rebase origin/liuyao-semantic-v013-core
          git push origin HEAD:liuyao-semantic-v013-core

      - name: Fail if no feasible unchanged-gate global threshold exists
        if: steps.train.outcome != 'success'
        run: |
          echo 'Fallback Identity single-text correction did not satisfy the frozen 98% / 5% / 5% calibration constraints.'
          exit 1
