name: LiuYao v0.13 Candidate Lock

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'scripts/generate-liuyao-semantic-v013-candidate-lock.mjs'
      - 'scripts/verify-liuyao-semantic-v013-candidate-lock.mjs'
      - 'data/liuyao-semantic-routeability-v0.3.json'
      - 'data/liuyao-semantic-routeability-v0.3.lock.json'
      - 'js/liuyao-semantic-route-evidence-v02.js'
      - 'js/liuyao-semantic-route-arbitration-v012.js'
      - 'js/liuyao-semantic-route-compatibility-v02.js'
      - 'js/liuyao-semantic-route-selection-v02.js'
      - 'js/liuyao-semantic-routeability-v03.js'
      - '.github/workflows/liuyao-v013-candidate-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate candidate manifest and lock
        run: node scripts/generate-liuyao-semantic-v013-candidate-lock.mjs
      - name: Verify candidate lock
        run: node scripts/verify-liuyao-semantic-v013-candidate-lock.mjs
      - name: Commit candidate lock
        run: |
          if [ -z "$(git status --porcelain -- data/liuyao-semantic-decision-stack-v0.13-candidate-v0.1.json data/liuyao-semantic-decision-stack-v0.13-candidate-v0.1.lock.json)" ]; then
            echo 'Candidate lock already matches current sources.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-decision-stack-v0.13-candidate-v0.1.json data/liuyao-semantic-decision-stack-v0.13-candidate-v0.1.lock.json
          git commit -m 'chore(liuyao): freeze v0.13 semantic candidate'
          git push origin HEAD:liuyao-semantic-v013-core
