name: Dependency watch

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check npm latest tags
        id: deps
        env:
          GUIJIA_DEP_REPORT: ${{ runner.temp }}/dependency-report.md
        run: node scripts/check-dependency-updates.mjs

      - name: Create or update tracking issue
        if: steps.deps.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.deps.outputs.report_path }}
        run: |
          title="Dependency update available · 龟甲"
          number="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$REPORT"
          else
            gh issue create --title "$title" --body-file "$REPORT"
          fi

      - name: No production mutation
        run: echo "Dependency watch reports only; it never changes vendor versions or production files."
