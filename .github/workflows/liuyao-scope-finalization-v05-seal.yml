name: LiuYao Scope Finalization v0.5 Seal

on:
  push:
    branches:
      - liuyao-semantic-v013-core-train-v01
    paths:
      - 'scripts/seal-liuyao-semantic-scope-finalization-v05-calibration.mjs'
      - 'scripts/verify-liuyao-semantic-scope-finalization-v05-sealed.mjs'
      - '.github/workflows/liuyao-scope-finalization-v05-seal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core-train-v01
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify Candidate v0.7 design and semantics
        run: |
          node scripts/verify-liuyao-semantic-v013-candidate-v07-design.mjs
          node scripts/verify-liuyao-semantic-v013-candidate-v07-semantics.mjs
          node scripts/verify-liuyao-semantic-v013-candidate-v07-v06-regression.mjs
      - name: Verify presealed Candidate v0.7 Scope calibration
        run: node scripts/verify-liuyao-semantic-scope-finalization-v05-calibration.mjs
      - name: Seal Candidate v0.7 Scope calibration
        run: node scripts/seal-liuyao-semantic-scope-finalization-v05-calibration.mjs
      - name: Verify sealed Candidate v0.7 Scope calibration
        run: node scripts/verify-liuyao-semantic-scope-finalization-v05-sealed.mjs
      - name: Commit sealed Candidate v0.7 Scope calibration and lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-scope-finalization-v0.5-calibration.json data/liuyao-semantic-scope-finalization-v0.5-calibration.lock.json
          git commit -m 'test(liuyao): seal candidate v0.7 scope calibration'
          git push origin HEAD:liuyao-semantic-v013-core-train-v01
