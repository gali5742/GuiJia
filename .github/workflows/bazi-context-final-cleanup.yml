name: BaZi final context cleanup

on:
  push:
    branches:
      - bazi-context-final-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: bazi-context-final-cleanup

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply BaZi final context cleanup
        run: |
          python3 .bazi-context-final-cleanup.py
          python3 .bazi-test-contract-cleanup.py

      - name: Core regression tests
        run: npm test

      - name: Build same-origin vendor site
        run: node scripts/build-pages-site.mjs

      - name: Verify vendor bytes and lunar smoke test
        run: node scripts/verify-vendor.mjs .site

      - name: Verify static Pages artifact
        run: node scripts/verify-static-site.mjs .site deployed

      - name: Commit verified BaZi-only changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .bazi-context-final-cleanup.py .bazi-test-contract-cleanup.py .github/workflows/bazi-context-final-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize BaZi transit context layering'
          git push origin HEAD:bazi-context-final-cleanup
