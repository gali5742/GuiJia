name: LiuYao Candidate v0.4 Corrected Failure Diagnosis v0.2

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'scripts/analyze-liuyao-semantic-v013-candidate-v04-development-failure-v02.mjs'
      - 'data/liuyao-semantic-v013-candidate-v04-development-report-v0.1.json'
      - 'data/liuyao-semantic-v013-candidate-v04-development-failure-diagnostic-v0.1.json'
      - 'data/liuyao-semantic-v013-candidate-v04-development.lock.json'
      - 'data/liuyao-semantic-v013-candidate-v04-runtime.lock.json'
      - 'data/liuyao-semantic-v013-candidate-v04-design-v0.1.json'
      - '.github/workflows/liuyao-v013-v04-development-failure-diagnostic-v02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-corrected:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate corrected immutable diagnosis
        run: node scripts/analyze-liuyao-semantic-v013-candidate-v04-development-failure-v02.mjs
      - name: Verify deterministic corrected diagnosis
        shell: bash
        run: |
          OUT='data/liuyao-semantic-v013-candidate-v04-development-failure-diagnostic-v0.2.json'
          BEFORE="$(sha256sum "$OUT" | cut -d' ' -f1)"
          node scripts/analyze-liuyao-semantic-v013-candidate-v04-development-failure-v02.mjs
          AFTER="$(sha256sum "$OUT" | cut -d' ' -f1)"
          test "$BEFORE" = "$AFTER"
          echo "diagnostic_v02_sha256=$AFTER"
      - name: Commit corrected immutable diagnosis
        shell: bash
        run: |
          OUT='data/liuyao-semantic-v013-candidate-v04-development-failure-diagnostic-v0.2.json'
          if [ -z "$(git status --porcelain -- "$OUT")" ]; then
            echo 'Corrected diagnosis already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'test(liuyao): record corrected Candidate v0.4 failure diagnosis v0.2'
          git push origin HEAD:liuyao-semantic-v013-core
