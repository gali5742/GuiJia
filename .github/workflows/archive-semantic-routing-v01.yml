name: Archive sealed semantic training run
on:
  push:
    branches: [liuyao-semantic-v013-core]
    paths: ['.github/workflows/archive-semantic-routing-v01.yml']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: github.event.head_commit.message == 'ci: archive sealed training run 45394279226'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          run-id: 45394279226
          github-token: ${{ github.token }}
          name: semantic-routing-weights
          path: ${{ runner.temp }}/semantic-weights
      - uses: actions/download-artifact@v4
        with:
          run-id: 45394279226
          github-token: ${{ github.token }}
          name: semantic-routing-development
          path: ${{ runner.temp }}/semantic-result
      - name: Verify both outputs and archive exact bytes
        run: |
          set -eu
          w="$RUNNER_TEMP/semantic-weights/weights.json"
          r="$RUNNER_TEMP/semantic-result/result.json"
          printf '%s  %s\n' 'e5d29fcfa1967f4be207468e233c76fc7faf8bfd10624053055ea73bc0b492b6' "$w" | sha256sum -c -
          jq -e '.source == "eb700ef596374068aa3ea4d84d5d9200bd0e913d" and .weightsSha256 == "e5d29fcfa1967f4be207468e233c76fc7faf8bfd10624053055ea73bc0b492b6" and (.results.gated | length) == 76' "$r"
          mkdir -p "experiments/liuyao-question-routing-v01/outputs"
          test ! -e "experiments/liuyao-question-routing-v01/outputs/weights.json"
          test ! -e "experiments/liuyao-question-routing-v01/outputs/result.json"
          cp "$w" "experiments/liuyao-question-routing-v01/outputs/weights.json"
          cp "$r" "experiments/liuyao-question-routing-v01/outputs/result.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "experiments/liuyao-question-routing-v01/outputs/weights.json" "experiments/liuyao-question-routing-v01/outputs/result.json"
          git commit -m 'data: preserve trained weights and all 76 development predictions [skip ci]'
          git push origin "HEAD:refs/heads/liuyao-semantic-v013-core"
