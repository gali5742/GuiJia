name: LiuYao v0.13 Fix Independent Eval Count

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - '.github/workflows/liuyao-v013-fix-independent-count.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fix E2E base-model integrity field name
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/run-liuyao-semantic-v013-independent-eval.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const from = "routeabilityV03.baseModel?.artifactSha256";
          const to = "routeabilityV03.baseModel?.sha256";
          if (!source.includes(from) && !source.includes(to)) throw new Error('integrity-check field not found');
          source = source.replace(from, to);
          fs.writeFileSync(file, source, 'utf8');
          NODE
      - name: Commit E2E infrastructure correction only
        run: |
          if [ -z "$(git status --porcelain -- scripts/run-liuyao-semantic-v013-independent-eval.mjs)" ]; then
            echo 'E2E runner already contains correction.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-liuyao-semantic-v013-independent-eval.mjs
          git commit -m 'test(liuyao): fix independent E2E base-model integrity field'
          git push origin HEAD:liuyao-semantic-v013-core
