name: LiuYao v0.13 Fix Independent Eval Count

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - '.github/workflows/liuyao-v013-fix-independent-count.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply pre-seal path-contract wording corrections
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/generate-liuyao-semantic-v013-independent-eval.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ['仓库里这批积压货下个月能不能清完','仓库里这批积压货下个月能不能卖完'],
            ['这单批发生意目前还在磋商，我想看看','这单批发订单目前还在磋商，我想看看'],
            ['ETF仓位要不要动一动这件事我一直拿不准','ETF仓位要不要调整一下这件事我一直拿不准']
          ];
          for (const [from, to] of replacements) {
            if (!source.includes(from) && !source.includes(to)) throw new Error(`fixture not found: ${from}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(file, source, 'utf8');
          NODE
      - name: Verify generator count before commit
        run: node scripts/generate-liuyao-semantic-v013-independent-eval.mjs
      - name: Commit generator correction only
        run: |
          if [ -z "$(git status --porcelain -- scripts/generate-liuyao-semantic-v013-independent-eval.mjs)" ]; then
            echo 'Generator already contains corrections.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-liuyao-semantic-v013-independent-eval.mjs
          git commit -m 'test(liuyao): correct pre-seal independent path fixtures'
          git push origin HEAD:liuyao-semantic-v013-core
