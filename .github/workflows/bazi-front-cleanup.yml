name: BaZi frontend cleanup

on:
  push:
    branches: [bazi-front-cleanup]
    paths:
      - '.github/workflows/bazi-front-cleanup.yml'

permissions:
  contents: write

# retry after aligning the legacy BaZi detail regression
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bazi-front-cleanup
      - name: Apply BaZi frontend cleanup
        run: |
          python3 .bazi-front-cleanup.py
          python3 .bazi-test-repair.py
      - name: Run full regression
        run: npm test
      - name: Commit verified BaZi-only changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .bazi-front-cleanup.py .bazi-test-repair.py .github/workflows/bazi-front-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: separate BaZi frontend wording from context boundaries'
          git push origin HEAD:bazi-front-cleanup
