name: LiuYao Semantic Dependencies v0.2 Representation Correction

on:
  push:
    branches:
      - liuyao-semantic-v013-core-train-v01
    paths:
      - 'data/liuyao-semantic-embedding-execution-contract-v0.1.json'
      - 'scripts/verify-liuyao-semantic-embedding-execution-contract-v01.mjs'
      - 'scripts/generate-liuyao-semantic-frozen-dependencies-v02.mjs'
      - 'scripts/verify-liuyao-semantic-frozen-dependencies-v02.mjs'
      - 'js/liuyao-semantic-frozen-dependencies-v02.js'
      - '.github/workflows/liuyao-semantic-dependencies-v02-correction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core-train-v01
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify embedding execution contract
        run: node scripts/verify-liuyao-semantic-embedding-execution-contract-v01.mjs
      - name: Install pinned encoder runtime
        run: npm install --no-save --package-lock=false @huggingface/transformers@4.2.0
      - name: Rebuild Router and Scope with runtime-equivalent single-text embeddings
        env:
          NODE_OPTIONS: --import ./scripts/liuyao-freeze-file-fetch-bootstrap.mjs
        run: node scripts/generate-liuyao-semantic-frozen-dependencies-v02.mjs
      - name: Verify corrected dependency artifact
        run: node scripts/verify-liuyao-semantic-frozen-dependencies-v02.mjs
      - name: Commit corrected dependency artifact and lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-frozen-dependencies-v0.2.json data/liuyao-semantic-frozen-dependencies-v0.2.lock.json
          git commit -m 'fix(liuyao): freeze runtime-equivalent semantic dependencies v0.2'
          git push origin HEAD:liuyao-semantic-v013-core-train-v01
