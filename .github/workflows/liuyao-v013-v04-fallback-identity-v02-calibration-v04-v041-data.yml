name: LiuYao v0.13-v0.4 Fallback Identity v0.2 Calibration v0.4 Schema v0.4.1 Data Seal

on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'data/liuyao-semantic-v013-candidate-v04-fallback-identity-v02-data-schema-v0.4.1.json'
      - 'scripts/run-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-schema-v041.mjs'
      - 'scripts/apply-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-preseal-diversity.mjs'
      - 'scripts/apply-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-preseal-lexical-correction.mjs'
      - '.github/workflows/liuyao-v013-v04-fallback-identity-v02-calibration-v04-v041-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal-calibration-v04-v041:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Capture immutable calibration v0.4/v0.4.1 base
        run: echo "CAL_V041_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify schema v0.4.1 provenance before generation
        run: |
          node - <<'NODE'
          const fs=require('fs');const crypto=require('crypto');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const blob=p=>{const b=fs.readFileSync(p);return crypto.createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex');};
          const s=require('./data/liuyao-semantic-v013-candidate-v04-fallback-identity-v02-data-schema-v0.4.1.json');
          if(s.status!=='frozen_after_v04_pregeneration_hash_type_failure_before_any_calibration_generation')process.exit(1);
          if(blob(s.supersedes.path)!==s.supersedes.gitBlobSha)process.exit(1);
          if(sha(s.carriedTrainingAugmentation.path)!==s.carriedTrainingAugmentation.sha256)process.exit(1);
          if(sha(s.supersededCalibration.path)!==s.supersededCalibration.sha256)process.exit(1);
          if(blob(s.supersededCalibration.reachabilityReportPath)!==s.supersededCalibration.reachabilityReportGitBlobSha)process.exit(1);
          if(s.freshCalibration.totalRows!==704||s.freshCalibration.routeKnown.total!==220||s.freshCalibration.nearDomainNonRoute.total!==440)process.exit(1);
          if(s.encoderBoundaryBeforeSeal.encoderScoringObserved!==false||s.encoderBoundaryBeforeSeal.fallbackIdentityTrainingPerformed!==false)process.exit(1);
          if(s.postSealReachabilityAudit.minimumNearDomainNonRouteReachingFallback!==8||s.postSealReachabilityAudit.minimumTotalNonRouteReachingFallback!==8)process.exit(1);
          NODE
      - name: Generate fresh calibration v0.4 under schema v0.4.1 without encoder scoring
        run: node scripts/run-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-schema-v041.mjs generate
      - name: Apply deterministic preseal cross-family diversity correction
        run: node scripts/apply-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-preseal-diversity.mjs
      - name: Apply deterministic preseal lexical collision correction
        run: node scripts/apply-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-preseal-lexical-correction.mjs
      - name: Verify preseal calibration v0.4 under schema v0.4.1
        run: node scripts/run-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-schema-v041.mjs verify
      - name: Seal calibration v0.4 before any post-seal encoder scoring
        run: node scripts/run-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-schema-v041.mjs seal
      - name: Verify sealed calibration v0.4 and lock
        run: node scripts/run-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-schema-v041.mjs verify
      - name: Commit sealed calibration v0.4 artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.4.json data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.4.lock.json
          if git diff --cached --quiet; then echo 'Calibration v0.4 artifacts already match committed state.'; exit 0; fi
          git commit -m 'test(liuyao): seal fallback calibration v0.4 under schema v0.4.1'
          git fetch origin liuyao-semantic-v013-core
          PROTECTED_PATHS=(
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-v02-data-schema-v0.4.json
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-v02-data-schema-v0.4.1.json
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-training-augmentation.json
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.3.json
            data/liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v0.3-reachability-audit-v0.1.json
            scripts/generate-liuyao-semantic-v013-candidate-v04-fallback-identity-v02-calibration-v04.mjs
            scripts/verify-liuyao-semantic-v013-candidate-v04-fallback-identity-v02-calibration-v04.mjs
            scripts/seal-liuyao-semantic-v013-candidate-v04-fallback-identity-v02-calibration-v04.mjs
            scripts/run-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-schema-v041.mjs
            scripts/apply-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-preseal-diversity.mjs
            scripts/apply-liuyao-semantic-v013-candidate-v04-fallback-identity-calibration-v04-preseal-lexical-correction.mjs
          )
          if ! git diff --quiet "$CAL_V041_BASE_SHA"..origin/liuyao-semantic-v013-core -- "${PROTECTED_PATHS[@]}"; then
            echo 'Calibration v0.4/v0.4.1 inputs changed during seal; refusing stale push.'
            git diff --name-only "$CAL_V041_BASE_SHA"..origin/liuyao-semantic-v013-core -- "${PROTECTED_PATHS[@]}"
            exit 1
          fi
          git rebase origin/liuyao-semantic-v013-core
          git push origin HEAD:liuyao-semantic-v013-core
