name: LiuYao v0.13-v0.3 Fallback Identity Diagnostic

on:
  push:
    branches:
      - liuyao-semantic-v013-core-train-v01
    paths:
      - 'scripts/diagnose-liuyao-semantic-v013-fallback-identity-v01.mjs'
      - 'scripts/diagnose-liuyao-semantic-v013-fallback-identity-v01-architecture.mjs'
      - '.github/workflows/liuyao-v013-v03-fallback-identity-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core-train-v01
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify frozen model
        run: node scripts/verify-liuyao-semantic-v013-fallback-identity-v01-model.mjs
      - name: Install pinned encoder runtime
        run: npm install --no-save @huggingface/transformers@4.2.0
      - name: Diagnose calibration ceilings and score separation
        run: node scripts/diagnose-liuyao-semantic-v013-fallback-identity-v01.mjs
      - name: Diagnose fallback architecture counterfactuals
        run: node scripts/diagnose-liuyao-semantic-v013-fallback-identity-v01-architecture.mjs
      - name: Commit aggregate diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-fallback-identity-v0.1-calibration-diagnostic.json data/liuyao-semantic-fallback-identity-v0.1-architecture-counterfactual.json
          git commit -m 'test(liuyao): record fallback identity architecture diagnosis'
          git push origin HEAD:liuyao-semantic-v013-core-train-v01
