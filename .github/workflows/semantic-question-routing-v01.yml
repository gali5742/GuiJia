name: Semantic question routing experiment 01
on:
  push:
    branches: [liuyao-semantic-v013-core]
    paths: ['experiments/liuyao-question-routing-v01/run.mjs']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --require ./scripts/liuyao-semantic-v013-candidate-v07-evaluation-read-guard.cjs
      EXPERIMENT: experiments/liuyao-question-routing-v01
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check membership and duplicates
        run: node "$EXPERIMENT/run.mjs" audit
      - name: Install pinned encoder
        run: |
          env -u NODE_OPTIONS npm install --prefix "$RUNNER_TEMP/semantic-runtime" --no-save --package-lock=false --no-audit --no-fund @huggingface/transformers@4.2.0
          echo "GUIJIA_TRANSFORMERS_PACKAGE_DIR=$RUNNER_TEMP/semantic-runtime/node_modules/@huggingface/transformers" >> "$GITHUB_ENV"
          echo "GUIJIA_ENCODER_CACHE_DIR=$RUNNER_TEMP/encoder-cache" >> "$GITHUB_ENV"
      - name: Train models
        run: node "$EXPERIMENT/run.mjs" train
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-routing-weights
          path: semantic-routing-output/weights.json
          if-no-files-found: error
      - name: Evaluate development set
        run: node "$EXPERIMENT/run.mjs" evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-routing-development
          path: semantic-routing-output/result.json
          if-no-files-found: error
