name: LiuYao v0.13 Post-Lock Independent Eval

# Explicit user-side rerun after pre-seal path-contract corrections.
on:
  push:
    branches:
      - liuyao-semantic-v013-core
    paths:
      - 'scripts/generate-liuyao-semantic-v013-independent-eval.mjs'
      - 'scripts/verify-liuyao-semantic-v013-independent-eval.mjs'
      - 'scripts/seal-liuyao-semantic-v013-independent-eval.mjs'
      - '.github/workflows/liuyao-v013-independent-eval.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liuyao-semantic-v013-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify locked candidate before eval generation
        run: node scripts/verify-liuyao-semantic-v013-candidate-lock.mjs
      - name: Generate post-lock independent eval
        run: node scripts/generate-liuyao-semantic-v013-independent-eval.mjs
      - name: Verify pre-seal paths, policy, and prior-corpus isolation
        run: node scripts/verify-liuyao-semantic-v013-independent-eval.mjs
      - name: Seal independent eval and create lock
        run: node scripts/seal-liuyao-semantic-v013-independent-eval.mjs
      - name: Verify sealed independent eval
        run: node scripts/verify-liuyao-semantic-v013-independent-eval.mjs
      - name: Commit sealed independent eval
        run: |
          if [ -z "$(git status --porcelain -- data/liuyao-semantic-decision-stack-v0.13-independent-eval.json data/liuyao-semantic-decision-stack-v0.13-independent-eval.lock.json)" ]; then
            echo 'Independent eval already matches sealed artifact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liuyao-semantic-decision-stack-v0.13-independent-eval.json data/liuyao-semantic-decision-stack-v0.13-independent-eval.lock.json
          git commit -m 'test(liuyao): seal post-lock v0.13 independent eval'
          git push origin HEAD:liuyao-semantic-v013-core
