name: Stage BaZi strength evidence loader

on:
  push:
    branches:
      - bazi-strength-evidence-extractor-stage

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: bazi-strength-evidence-extractor-stage
          fetch-depth: 0
      - name: Insert strength evidence script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="./js/bazi-assessment.js?v=13.44.0"></script>'
          new = '<script src="./js/bazi-strength-evidence.js?v=13.44.0"></script>\n' + old
          if new not in text:
              if old not in text:
                  raise SystemExit('bazi-assessment script tag not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit staged patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/bazi-strength-stage-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bazi-strength-stage-patch.yml
          git commit -m "chore: wire BaZi strength evidence script"
          git push origin HEAD:bazi-strength-evidence-extractor-stage
